name: Release

# On every push to main, release-please opens or updates a release PR (version
# bump + CHANGELOG from Conventional Commits). Merging that PR creates the tag
# and a *draft* GitHub Release; the build job below then attaches the Windows
# installers. Publishing the draft is done by hand.
#
# The build runs in this workflow (not on the tag push) because tags created
# with GITHUB_TOKEN do not trigger other workflows.
#
# Running the workflow manually builds the installers (and the updater's latest.json and
# .sig files) as artifacts only. The build job uses the `release` environment, so manual
# runs work from main only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # release-please acts with a GitHub App token (installed on this repository only),
    # so GITHUB_TOKEN needs no permissions and Actions need not be allowed to create PRs.
    # Release PRs opened by the App also run CI without manual approval.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  build:
    needs: release-please
    # always(): still run for workflow_dispatch, where release-please is skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    # Holds the updater signing key (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]); deployable from main only.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Updater public key (minisign key ID 3541035D1389828D), the pair of the signing key.
      UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDM1NDEwMzVEMTM4OTgyOEQKUldTTmdva1RYUU5CTmVFZjdCY25lbms4dTFBSjdlVGpjYlVMYXlMcFo0c28wRmloLytWVExkVlUK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Check version
        id: version
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($pkg -ne $cargo) { throw "version mismatch: package.json $pkg, Cargo.toml $cargo" }
          if ($env:TAG -and $env:TAG -ne "v$pkg") { throw "tag $env:TAG does not match version $pkg" }
          "version=$pkg" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Prebuilt ONNX Runtime fetched by the `ort` crate at build time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # beforeBuildCommand runs `npm run build` (type check + frontend build).
      # --locked fails the build if Cargo.lock was not updated with the version.
      # Updater artifacts (a .sig next to each installer) are enabled here rather than in
      # tauri.conf.json, so local builds do not need the signing key.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is not set' }
          # The bundler also requires plugins.updater.pubkey; merging the same key again is a no-op
          # once tauri.conf.json has it.
          $config = Join-Path $env:RUNNER_TEMP 'updater.conf.json'
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBKEY } }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $config
          npx tauri build --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      - name: Collect installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $files = @(
            "$bundle/nsis/Leafbound_${env:VERSION}_x64-setup.exe",
            "$bundle/msi/Leafbound_${env:VERSION}_x64_en-US.msi"
          )
          New-Item -ItemType Directory dist-release | Out-Null
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            Copy-Item $f dist-release/
          }
          # Builds are not code-signed yet; checksums let people verify downloads.
          Get-ChildItem dist-release | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt

      # latest.json for tauri-plugin-updater: the NSIS installer is the update package.
      # Its URL resolves once the draft is published (drafts are never "latest").
      - name: Updater manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($f in "nsis/Leafbound_${env:VERSION}_x64-setup.exe.sig", "msi/Leafbound_${env:VERSION}_x64_en-US.msi.sig") {
            if (-not (Test-Path "$bundle/$f")) { throw "missing $bundle/$f" }
            Copy-Item "$bundle/$f" dist-release/
          }
          $url = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/v${env:VERSION}/Leafbound_${env:VERSION}_x64-setup.exe"
          node scripts/updater-artifacts.mjs manifest --version $env:VERSION --installer "dist-release/Leafbound_${env:VERSION}_x64-setup.exe" --url $url --changelog CHANGELOG.md --out dist-release/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'latest.json generation failed' }
          # Same check as the updater: fails if the secret is not the pair of UPDATER_PUBKEY.
          node scripts/updater-artifacts.mjs verify --manifest dist-release/latest.json --dir dist-release --version $env:VERSION --url $url
          if ($LASTEXITCODE -ne 0) { throw 'updater signature check failed' }

      - name: Attest build provenance
        if: env.TAG != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.msi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leafbound-${{ steps.version.outputs.version }}-windows
          path: dist-release/
          if-no-files-found: error

      - name: Upload to the draft release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:TAG --json isDraft | ConvertFrom-Json
          if (-not $release) { throw "release $env:TAG not found" }
          if (-not $release.isDraft) { throw "release $env:TAG is already published; not replacing its files" }
          $assets = Get-ChildItem dist-release | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
