name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Rust: the stable toolchain that comes with the runner image, not updated in each job
# (that took 20-27 s per job). It can lag the latest stable by about a week, one image
# cycle; release.yml installs the latest. These two were set by dtolnay/rust-toolchain.
#
# CARGO_HOME (the registry, about 31,000 files once unpacked) goes on the runner's D: drive,
# next to the workspace: Cargo unpacks the crates about 3x faster there than on C:, the
# image's OS disk. The toolchain itself (RUSTUP_HOME) stays on C:.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Most jobs run on Windows: the E2E suites drive WebView2 over CDP. check-macos builds the
# Rust side for macOS (Keychain, Finder's open events), which Windows never compiles.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The image's disk (C:) is slow on first read, and the first compile spent about 10 s
      # paging in rustc (rustc_driver is a 200 MB DLL). Read the toolchain once in the
      # background while the next steps run.
      - name: Warm up the Rust toolchain
        run: |
          $warm = {
            $sysroot = rustc --print sysroot
            Get-ChildItem -Recurse -File "$sysroot\bin", "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\lib" |
              Where-Object Extension -ne '.pdb' |
              ForEach-Object { $f = [IO.File]::OpenRead($_.FullName); $f.CopyTo([IO.Stream]::Null); $f.Dispose() }
            "toolchain read by $(Get-Date -Format o)" > "$env:RUNNER_TEMP\rust-warm.txt"
          }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($warm.ToString()))
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-EncodedCommand', $encoded

      # node_modules itself, keyed on the lockfile: on a hit there is nothing to install.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Biome (scope, style and rules in biome.json): formatting, then the recommended lint
      # rules, where warnings fail too.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # App and E2E TypeScript.
      - name: Type check
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm test

      # Production build of the frontend (also gives Tauri its dist/).
      - name: Build frontend
        run: npm run build

      # The runner image's stable Rust, used as is (see the env above).
      - name: Rust toolchain
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          Get-Content "$env:RUNNER_TEMP\rust-warm.txt" -ErrorAction Ignore
          $installed = rustup component list --installed
          foreach ($c in 'clippy', 'rustfmt') {
            if (-not ($installed -match "^$c-")) { rustup component add $c }
          }
          rustc -vV
          cargo clippy -V
          cargo fmt --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Prebuilt ONNX Runtime fetched by the `ort` crate at build time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      # Before Clippy: needs no build, so a formatting slip fails fast.
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # The embedding model test is #[ignore]d (it downloads ~135 MB).
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # tauri::generate_context! embeds dist/.
      - name: Build frontend
        run: npm run build

      - name: Rust toolchain
        run: |
          rustup component add clippy
          rustc -vV

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-${{ runner.arch }}-

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # Browser build against the mock backend, in Playwright's Chromium (cached per Playwright version).
  e2e-mock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # node_modules itself, keyed on the lockfile: on a hit there is nothing to install.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Playwright version
        id: playwright
        run: |
          $version = node -p "require('./node_modules/@playwright/test/package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Each Playwright version pins its own Chromium build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Headless only, so the shell is enough; does nothing when the cache has it.
      - name: Install Chromium
        run: npx playwright install chromium --only-shell

      - name: E2E (mock)
        run: npm run e2e:mock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-mock
          path: |
            e2e/report/
            e2e/results/
          if-no-files-found: ignore

  # The real app (built with an E2E identifier) over WebView2 CDP, with a fake LLM.
  # The app tests run one at a time (one app per machine), so they are split across three
  # runners; each builds the app and runs a third of the tests (whole files, so a shard can
  # take more or fewer).
  e2e-app:
    name: e2e-app (${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The image's disk (C:) is slow on first read, and the first compile spent about 10 s
      # paging in rustc (rustc_driver is a 200 MB DLL). Read the toolchain once in the
      # background while the next steps run.
      - name: Warm up the Rust toolchain
        run: |
          $warm = {
            $sysroot = rustc --print sysroot
            Get-ChildItem -Recurse -File "$sysroot\bin", "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\lib" |
              Where-Object Extension -ne '.pdb' |
              ForEach-Object { $f = [IO.File]::OpenRead($_.FullName); $f.CopyTo([IO.Stream]::Null); $f.Dispose() }
            "toolchain read by $(Get-Date -Format o)" > "$env:RUNNER_TEMP\rust-warm.txt"
          }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($warm.ToString()))
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-EncodedCommand', $encoded

      # node_modules itself, keyed on the lockfile: on a hit there is nothing to install.
      - id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install npm packages
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Rust toolchain
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          Get-Content "$env:RUNNER_TEMP\rust-warm.txt" -ErrorAction Ignore
          rustc -vV

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      # The real embedding model (~135 MB); downloaded by the app on a cache miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-model
          key: e2e-model-multilingual-e5-small-int8@761b726d

      - name: E2E (app)
        run: npm run e2e:app -- --shard=${{ matrix.shard }}/3
        env:
          E2E_MODEL_DIR: ${{ runner.temp }}/e2e-model

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-app-${{ matrix.shard }}
          path: |
            e2e/report/
            e2e/results/
          if-no-files-found: ignore
