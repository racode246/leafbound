[package]
name = "leafbound"
version = "0.1.1"
description = "A calm, open-source EPUB reader for Windows."
authors = ["racode246"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "leafbound_lib"
# Windows desktop only: the binary links the rlib. The template's staticlib/cdylib
# (iOS/Android) would each bundle every dependency, ONNX Runtime included.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
epub = "2"
chrono = "0.4"
sha2 = "0.10"
imagesize = "0.13"
# Reading assistant: local embeddings, SQLite vector store, LLM HTTP client, OS keychain.
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }

# Keep debug builds small: line numbers for our own code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
zip = { version = "3", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt"] }
